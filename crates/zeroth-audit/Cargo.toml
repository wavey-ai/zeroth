[package]
name = "zeroth-audit"
version.workspace = true
edition.workspace = true
description = "Typed audit events and explicit persistence sinks for Zeroth"
license.workspace = true
homepage.workspace = true

[features]
default = []
postgres = ["dep:tokio", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-native-certs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "time"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", features = ["ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
