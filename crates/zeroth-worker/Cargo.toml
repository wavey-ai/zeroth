[package]
name = "zeroth-worker"
version.workspace = true
edition.workspace = true
description = "Cloudflare Worker deployment surface for Zeroth"
license.workspace = true
homepage.workspace = true
exclude = ["build/**"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
google-directory-native = ["dep:reqwest"]

[dependencies]
base64.workspace = true
console_error_panic_hook.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom.workspace = true
hmac.workspace = true
k256.workspace = true
p256.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }
serde_urlencoded.workspace = true
sha2.workspace = true
sha3.workspace = true
url.workspace = true
urlencoding.workspace = true
web-sys.workspace = true
worker.workspace = true
zeroth-audit.workspace = true
zeroth-core.workspace = true
zeroth-oidc.workspace = true
zeroth-providers.workspace = true
zeroth-server.workspace = true
zeroth-machine.workspace = true
zeroth-storage.workspace = true
zeroth-ui.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rsa.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
rsa.workspace = true
