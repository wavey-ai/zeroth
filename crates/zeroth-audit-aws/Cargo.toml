[package]
name = "zeroth-audit-aws"
version.workspace = true
edition.workspace = true
description = "Native DynamoDB transactional audit capture and SQS delivery adapters"
license.workspace = true
homepage.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The legacy `rustls` SDK default pulls an obsolete TLS 0.21 stack. Select the
# current HTTPS connector explicitly, keeping the regular Tokio runtime.
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
zeroth-audit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
