[package]
name = "zeroth-aws-authorizer"
version.workspace = true
edition.workspace = true
publish = false
description = "Zeroth ES256 issuer-token authorizer for AWS API Gateway"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
base64.workspace = true
lambda_runtime = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
zeroth-oidc.workspace = true

[dev-dependencies]
p256.workspace = true
